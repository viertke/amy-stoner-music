<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    .header-image-wrapper {
        position: relative;
    }
    
    .responsive-header-container {
        min-height: 400px; 
        background-repeat: no-repeat;
        background-position: center top; 
        background-size: cover;
    }

    /* DESKTOP IMAGE */
    .responsive-header-container {
        background-image: url('https://images.squarespace-cdn.com/content/v1/5b6d20d275f9eec4173d7cc7/06a10f32-11ae-44c6-b729-6161a7bce2db/Friedl_Xmas2024_WebHome1920x750-GREEN.jpg'); 
    }

    /* MOBILE IMAGE */
    @media (max-width: 768px) {
        .responsive-header-container {
            min-height: 250px; 
            background-image: url('https://images.squarespace-cdn.com/content/v1/5b6d20d275f9eec4173d7cc7/ec1e9ebe-5ac6-4f29-b8ae-fe8ac6f3951c/Friedl_Xmas2025_SocialSquare1080x1080-RED.jpg');
        }
    }
    
    /* Rock Academy Logo Overlay */
    .rock-academy-container {
        position: absolute;
        bottom: 20px;
        right: 20px;
        text-align: center;
        z-index: 10;
    }
    
    .performances-text {
        font-size: 14px;
        font-weight: 600;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        font-family: Arial, Helvetica, sans-serif;
    }
    
    .rock-academy-logo {
        max-width: 200px;
        width: 200px;
        height: auto;
        display: block;
    }
    
    @media (max-width: 768px) {
        .rock-academy-container {
            bottom: 15px;
            right: 15px;
        }
        
        .performances-text {
            font-size: 11px;
            margin-bottom: 5px;
        }
        
        .rock-academy-logo {
            max-width: 120px;
            width: 120px;
        }
    }
</style>

<div class="header-image-wrapper">
    <div class="responsive-header-container"></div>
    <div class="rock-academy-container">
        <div class="performances-text">Performances By:</div>
        <img src="https://images.squarespace-cdn.com/content/5b6d20d275f9eec4173d7cc7/be9cdd14-ae8e-4649-a4b8-06c33717542b/sticker+version+Rock+Academy+TEAL+with+orange+with+tagline+RGB.png?content-type=image%2Fpng" alt="Rock Academy - Eastern Iowa Arts Academy" class="rock-academy-logo">
    </div>
</div>
