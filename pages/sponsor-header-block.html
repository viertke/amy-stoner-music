<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* Imports the Google fonts used: Parisienne (Script) */
  @import url('https://fonts.googleapis.com/css2?family=Parisienne&display=swap');
  /* Container styling for the subtle overlay effect */
  .intro-header-container {
    position: relative; /* Needed for the ::before and ::after overlays */
    overflow: hidden; /* Ensures the overlay stays inside the div */
    /* Ensure the original gold texture is beneath everything */
    background: url('https://www.transparenttextures.com/patterns/gold-dust.png') repeat, #f6f6f2;
    background-size: cover;
  }
  /* 1. Dark contrast overlay to help text visibility (Very subtle, 5% dark) */
  .intro-header-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* Subtle dark, semi-transparent overlay for contrast */
    background: rgba(0, 0, 0, 0.05); 
    pointer-events: none; /* Allows clicks to pass through to the content */
    z-index: 1; 
  }
  /* 2. REPLACED EXTERNAL SNOWFLAKE IMAGE WITH PURE CSS TEXTURE */
  .intro-header-container::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    /* Creates a subtle, light diagonal line pattern (pure CSS, unblockable) */
    background-image: repeating-linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.5),
        rgba(255, 255, 255, 0.5) 1px,
        transparent 1px,
        transparent 15px
    );
    /* Very faint opacity */
    opacity: 0.15; 
    pointer-events: none;
    z-index: 2; /* Increased z-index */
  }
  /* Text content needs z-index > 2 to sit above both overlays */
  .intro-text-wrapper {
    position: relative;
    z-index: 3; 
  }
  /* EIAA Logo Section Styling */
  .eiaa-section {
    margin-top: 30px;
    padding-top: 25px;
    border-top: 1px solid rgba(92, 92, 92, 0.2);
  }
  .eiaa-logo {
    max-width: 150px;
    height: auto;
    display: block;
    margin: 15px auto 0;
  }
  /* --- Mobile Responsiveness Adjustments --- */
  @media (max-width: 600px) {
    /* 1. Reduce overall vertical padding on mobile */
    .intro-header-container {
        padding: 40px 20px 20px 20px !important; /* Tighter bottom margin */
    }
    
    /* 2. Shrink the main title dramatically for a better fit */
    .intro-header h1 {
      font-size: 24px !important; 
      margin-bottom: 15px !important;
    }
    
    /* 3. Shrink the body text and increase line height for better spacing */
    .intro-header p {
      font-size: 16px !important; /* Slightly increased mobile text size */
      line-height: 1.6 !important;
    }
    /* 4. Ensure inner text is perfectly centered on mobile */
    .intro-text-wrapper {
        text-align: center !important;
    }
    /* 5. Adjust EIAA section spacing on mobile */
    .eiaa-section {
      margin-top: 20px;
      padding-top: 20px;
    }
    .eiaa-logo {
      max-width: 110px;
    }
  }
</style>
<!-- BACKGROUND: All background settings moved to CSS class for layered effect -->
<div class="intro-header intro-header-container" style="padding:70px 20px 40px 20px; color:#2c2c2c; text-align:center;">
    <!-- Added class "intro-text-wrapper" for explicit text centering -->
    <div class="intro-text-wrapper" style="max-width:700px; margin:0 auto; text-align: center;">
        
        <!-- REDUCED DESKTOP FONT SIZE TO 38PX TO FORCE ONE LINE -->
        <h1 style="font-size:38px; color:#184a2c; margin-bottom:25px; font-weight:700; text-transform:none; letter-spacing:1px; font-family:'Parisienne', cursive; line-height:1.2; font-style:normal;">Be Part of an Unforgettable Event!</h1>
        
        <!-- NEW CONCISE TEXT BLOCK (Corrected bolds/asterisks) -->
        <p style="font-size:17px; color:#5c5c5c; margin-bottom:0; line-height:1.7; font-family:'Helvetica Neue', Arial, sans-serif;">
            Explore options below to support this anticipated holiday event while <strong>promoting your brand</strong> to an audience that values the arts and community&nbsp;connection.
        </p>
        
        <!-- EIAA BENEFIT SECTION -->
        <div class="eiaa-section">
            <p style="font-size:16px; color:#5c5c5c; margin-bottom:0; line-height:1.7; font-family:'Helvetica Neue', Arial, sans-serif;">
                A portion of the proceeds will benefit:
            </p>
            <img src="https://images.squarespace-cdn.com/content/5b6d20d275f9eec4173d7cc7/8a7592b1-c2d1-4542-9d00-84acddcd9ca3/EIAA+Logo+Horizontal+FULL+COLOR+RGB.png?content-type=image%2Fpng" alt="Eastern Iowa Arts Academy" style="max-width: 200px !important; width: 200px !important; height: auto !important; display: block !important; margin: 15px auto 0 !important;">
        </div>
        
    </div>
</div>
