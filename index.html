<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amy Friedl Stoner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Lato', sans-serif;
            overflow: hidden;
        }

        /* Full-screen hero section */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background-color: #70583e;
        }

        .hero-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 47% 25%;
            z-index: 1;
        }

        /* Content overlay */
        .hero-content {
            position: relative;
            z-index: 2;
            padding-left: 8%;
            color: white;
        }

        /* Amy text - handwritten script */
        .name-amy {
            font-family: 'Allura', cursive;
            font-size: 5.5rem;
            font-weight: 400;
            color: white;
            margin-bottom: -0.5rem;
            line-height: 1;
            letter-spacing: 0.05em;
        }

        /* Friedl text - uppercase tracking */
        .name-friedl {
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            margin-bottom: 2rem;
        }

        /* Discover button */
        .discover-btn {
            display: inline-block;
            padding: 12px 32px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.85rem;
            font-weight: 400;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .discover-btn:hover {
            background-color: rgba(0, 0, 0, 0.9);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Social icons */
        .social-icons {
            display: flex;
            gap: 12px;
        }

        .social-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            background-color: rgba(0, 0, 0, 0.7);
            transform: scale(1.1);
        }

        .social-icon svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .hero-content {
                padding-left: 6%;
            }

            .name-amy {
                font-size: 4rem;
            }

            .name-friedl {
                font-size: 0.85rem;
                letter-spacing: 0.4em;
            }

            .discover-btn {
                padding: 10px 28px;
                font-size: 0.75rem;
            }

            .social-icon {
                width: 28px;
                height: 28px;
            }

            .social-icon svg {
                width: 16px;
                height: 16px;
            }
        }

        @media (max-width: 480px) {
            .hero-content {
                padding-left: 5%;
            }

            .name-amy {
                font-size: 3rem;
            }

            .name-friedl {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="images/amygorgeous_orig.webp" alt="Amy Friedl Stoner" class="hero-image">
        
        <div class="hero-content">
            <h1 class="name-amy">Amy</h1>
            <p class="name-friedl">F R I E D L</p>
            
            <a href="bio.html" class="discover-btn">Discover</a>
            
            <div class="social-icons">
                <a href="http://instagram.com/amyfriedlstonermusic" target="_blank" class="social-icon" aria-label="Instagram">
                    <svg viewBox="0 0 24 24">

                </a>
                <a href="https://www.facebook.com/amystonersings/" target="_blank" class="social-icon" aria-label="Facebook">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
